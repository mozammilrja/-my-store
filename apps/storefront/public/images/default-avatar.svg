<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F7F5" />
      <stop offset="100%" stop-color="#EDE8E3" />
    </linearGradient>
    <linearGradient id="avatar-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9C7A4E" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="98" fill="url(#avatar-bg)" stroke="#E4DFD7" stroke-width="2" />
  
  <!-- Subtle inner atelier accent ring -->
  <circle cx="100" cy="100" r="91" fill="none" stroke="url(#avatar-gold)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.65" />
  
  <!-- Head silhouette -->
  <circle cx="100" cy="74" r="32" fill="#1B1C1B" />
  
  <!-- Shoulders & bust silhouette -->
  <path d="M42 168 C 42 128, 68 116, 100 116 C 132 116, 158 128, 158 168 C 158 174, 150 180, 140 180 L 60 180 C 50 180, 42 174, 42 168 Z" fill="#1B1C1B" />
  
  <!-- Atelier gold collar emblem -->
  <path d="M96 119 L104 119 L100 126 Z" fill="url(#avatar-gold)" />
</svg>
