<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E9">
<title>You're offline | AVELIQ</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px max(24px, env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
    background: #F5F1E9; color: #171717; font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 26rem; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 2rem; line-height: 1.2; margin: 16px 0 8px; }
  p { margin: 0 0 24px; color: #4a4a4a; }
  button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #171717; color: #fff; font: 600 15px/1 inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid #171717; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="56" height="56">
  <h1>You're offline</h1>
  <p>This page needs a connection. Your bag is saved: it'll be there when you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener("online", function () { location.reload() })</script>
</body>
</html>
