<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Offline | AVELIQ Operations</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #F6F7FA; --panel: #fff; --ink: #0F172A; --ink2: #475569; --accent: #4F46E5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #090B10; --panel: #11141B; --ink: #EDF0F5; --ink2: #A3AEC2; --accent: #818CF8; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 24px calc(24px + env(safe-area-inset-bottom)); background: var(--bg); color: var(--ink);
    font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 24rem; width: 100%; background: var(--panel); border-radius: 8px; padding: 24px; box-shadow: 0 1px 3px rgb(15 23 42 / .08); }
  img { width: 40px; height: 40px; border-radius: 8px; }
  h1 { font-size: 18px; margin: 14px 0 6px; }
  p { margin: 0 0 18px; color: var(--ink2); }
  button { width: 100%; min-height: 48px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: 600 15px/1 inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>No connection</h1>
  <p>The operations portal needs the internet to load your work. Nothing you entered before going offline was sent twice: check it once you're back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener("online", function () { location.reload() })</script>
</body>
</html>
