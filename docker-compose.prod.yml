# ==============================================================================
# EVERWEAR COMMERCE PLATFORM - PRODUCTION DOCKER COMPOSE CONFIGURATION
# High-availability orchestration with replica set, health checks, & SSL proxy
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database with Single-Node Replica Set (rs0)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0-jammy
    container_name: everwear-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - everwear-internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate().ok }"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Everwear Commerce Backend API (@dtc/backend)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: everwear-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 9100
      MONGODB_URI: mongodb://mongodb:27017/everwear?replicaSet=rs0
      MONGODB_DB: ${MONGODB_DATABASE:-everwear}
      JWT_SECRET: ${JWT_SECRET}
      STORE_CORS: ${STORE_CORS:-https://everwear.com,https://shop.everwear.com}
      ADMIN_CORS: ${ADMIN_CORS:-https://admin.everwear.com}
      WAREHOUSE_CORS: ${WAREHOUSE_CORS:-https://warehouse.everwear.com}
      RIDER_CORS: ${RIDER_CORS:-https://rider.everwear.com}
      SELLER_CORS: ${SELLER_CORS:-https://sellers.everwear.com}
      STOREFRONT_URL: ${STOREFRONT_URL:-https://everwear.com/in}
      RIDER_APP_URL: ${RIDER_APP_URL:-https://rider.everwear.com}
      WAREHOUSE_APP_URL: ${WAREHOUSE_APP_URL:-https://warehouse.everwear.com}
      NOTIFY_EMAIL_PROVIDER: ${NOTIFY_EMAIL_PROVIDER:-}
      NOTIFY_SMS_PROVIDER: ${NOTIFY_SMS_PROVIDER:-}
      NOTIFY_WHATSAPP_PROVIDER: ${NOTIFY_WHATSAPP_PROVIDER:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SES_REGION: ${SES_REGION:-}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID:-}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      WHATSAPP_META_TOKEN: ${WHATSAPP_META_TOKEN:-}
      WHATSAPP_META_PHONE_NUMBER_ID: ${WHATSAPP_META_PHONE_NUMBER_ID:-}
      GUPSHUP_API_KEY: ${GUPSHUP_API_KEY:-}
      GUPSHUP_SOURCE: ${GUPSHUP_SOURCE:-}
      GUPSHUP_APP_NAME: ${GUPSHUP_APP_NAME:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@everwear.com}
      FCM_SERVICE_ACCOUNT_BASE64: ${FCM_SERVICE_ACCOUNT_BASE64:-}
      PRIVATE_UPLOADS_DIR: /app/apps/backend/private-uploads
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.everwear.com}
      UPLOADS_DIR: /app/apps/backend/uploads
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      DELHIVERY_MODE: ${DELHIVERY_MODE:-production}
      DELHIVERY_API_KEY: ${DELHIVERY_API_KEY:-}
      DELHIVERY_CLIENT_ID: ${DELHIVERY_CLIENT_ID:-}
      BLUEDART_API_MODE: ${BLUEDART_API_MODE:-production}
      BLUEDART_CUSTOMER_CODE: ${BLUEDART_CUSTOMER_CODE:-}
      BLUEDART_LOGIN_ID: ${BLUEDART_LOGIN_ID:-}
      BLUEDART_LICENCE_KEY: ${BLUEDART_LICENCE_KEY:-}
    volumes:
      - backend_uploads:/app/apps/backend/uploads
      - backend_private_uploads:/app/apps/backend/private-uploads
    networks:
      - everwear-internal
    ports:
      - "127.0.0.1:9100:9100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Everwear Next.js 16 Storefront (@dtc/storefront)
  # ----------------------------------------------------------------------------
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        EVERWEAR_API_URL: http://backend:9100
        NEXT_PUBLIC_API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.everwear.com}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://everwear.com}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-in}
    container_name: everwear-storefront
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8001
      EVERWEAR_API_URL: http://backend:9100
      NEXT_PUBLIC_API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.everwear.com}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://everwear.com}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-in}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    networks:
      - everwear-internal
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 4. Everwear Operations Admin SPA (@dtc/admin)
  # ----------------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-https://api.everwear.com}
    container_name: everwear-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - everwear-internal
    ports:
      - "127.0.0.1:7001:7001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4b. Warehouse floor app (@dtc/warehouse)
  # ----------------------------------------------------------------------------
  warehouse:
    build:
      context: .
      dockerfile: apps/warehouse/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-https://api.everwear.com}
    container_name: everwear-warehouse
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - everwear-internal
    ports:
      - "127.0.0.1:7101:7101"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7101/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4c. Rider app (@dtc/rider)
  # ----------------------------------------------------------------------------
  rider:
    build:
      context: .
      dockerfile: apps/rider/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-https://api.everwear.com}
    container_name: everwear-rider
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - everwear-internal
    ports:
      - "127.0.0.1:7201:7201"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7201/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4d. Seller hub (@dtc/seller)
  # ----------------------------------------------------------------------------
  seller:
    build:
      context: .
      dockerfile: apps/seller/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-https://api.everwear.com}
    container_name: everwear-seller
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - everwear-internal
    ports:
      - "127.0.0.1:7301:7301"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7301/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 5. Production Edge Reverse Proxy (Nginx + SSL Termination)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:alpine
    container_name: everwear-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - storefront
      - admin
      - warehouse
      - rider
      - seller
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - everwear-internal

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  backend_uploads:
    driver: local
  backend_private_uploads:
    driver: local
  certbot_www:
    driver: local

networks:
  everwear-internal:
    driver: bridge
